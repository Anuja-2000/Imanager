version: '3.8'

services:
  imanager-app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - mysql-db
    networks:
      - imanager-network
    restart: unless-stopped

  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: Imanager_db
      MYSQL_USER: imanager_user
      MYSQL_PASSWORD: imanager_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - imanager-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  imanager-network:
    driver: bridge
